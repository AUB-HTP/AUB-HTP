name: "Sphinx: Render docs"

# Runs from the default branch after every release, so releases cut from
# any maintenance/v* branch rebuild the docs of all versions.
on:
  workflow_run:
    workflows: ["Release Pipeline"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Get Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build HTML for every version
        run: uv run --no-project python docs/build_versions.py --base-url "${{ steps.pages.outputs.base_url }}" --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
